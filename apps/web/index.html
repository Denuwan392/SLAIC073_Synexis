<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🇱🇰 Sri Lanka Transport Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- Leaflet Interactive Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            font-size: 15px;
        }

        .msg {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .typing-indicator {
            display: inline-block;
            width: 3px;
            height: 16px;
            background: #1976d2;
            margin: 0 2px;
            animation: typing 1s infinite;
        }

        .typing-indicator:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 100% {
                opacity: 0.2;
            }
            50% {
                opacity: 1;
            }
        }

        .sidebar {
            height: 100vh;
            transition: all 0.3s ease;
        }

        .main-content {
            height: 100vh;
            transition: all 0.3s ease;
        }

        .markdown-content h1,
        .markdown-content h2,
        .markdown-content h3,
        .markdown-content h4,
        .markdown-content h5,
        .markdown-content h6 {
            margin-top: 0.8rem;
            margin-bottom: 0.4rem;
            font-weight: 600;
            font-size: 1.15em;
        }

        .markdown-content p {
            margin-bottom: 0.8rem;
            line-height: 1.6;
            font-size: 1em;
        }

        .markdown-content ul,
        .markdown-content ol {
            margin-bottom: 0.8rem;
            padding-left: 1.3rem;
            font-size: 1em;
        }

        .markdown-content li {
            margin-bottom: 0.25rem;
            line-height: 1.5;
        }

        .markdown-content table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 0.8rem;
            font-size: 0.95em;
        }

        .markdown-content th,
        .markdown-content td {
            border: 1px solid #e5e7eb;
            padding: 0.5rem;
            text-align: left;
        }

        .markdown-content th {
            background-color: #f3f4f6;
            font-weight: 600;
        }

        .markdown-content code {
            background-color: #f3f4f6;
            padding: 0.2rem 0.4rem;
            border-radius: 0.25rem;
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
            font-size: 0.9em;
        }

        .markdown-content pre {
            background-color: #f3f4f6;
            padding: 0.9rem;
            border-radius: 0.4rem;
            overflow-x: auto;
            margin-bottom: 0.9rem;
            font-size: 0.95em;
        }

        .markdown-content * {
            max-width: 100%;
            word-wrap: break-word;
        }

        /* Leaflet Map Custom Styling */
        #fullMap {
            background: #e5e7eb;
            z-index: 1;
        }

        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            padding: 4px;
        }

        .leaflet-popup-content {
            margin: 10px 14px;
            line-height: 1.5;
            font-family: 'Inter', sans-serif;
        }

        /* Mobile Responsive Design */
        @media (max-width: 768px) {
            .sidebar {
                width: 280px;
                transform: translateX(-100%);
                z-index: 50;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main-content {
                width: 100%;
            }

            .overlay {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background-color: rgba(0, 0, 0, 0.5);
                z-index: 40;
                display: none;
            }

            .overlay.active {
                display: block;
            }

            body {
                font-size: 14px;
            }

            .container {
                padding: 0.5rem;
            }

            #chatbox {
                padding: 0.5rem;
            }

            .max-w-3xl {
                max-width: 100%;
            }

            .w-56 {
                width: 280px;
            }
        }

        @media (max-width: 480px) {
            body {
                font-size: 13px;
            }

            .p-4 {
                padding: 0.75rem;
            }

            .p-3 {
                padding: 0.5rem;
            }

            .text-base {
                font-size: 0.95rem;
            }

            .text-sm {
                font-size: 0.875rem;
            }

            .text-xs {
                font-size: 0.75rem;
            }

            .rounded-lg {
                border-radius: 0.375rem;
            }

            .space-x-3>*+* {
                margin-left: 0.5rem;
            }

            .space-y-4>*+* {
                margin-top: 0.75rem;
            }
        }
    </style>
</head>

<body class="bg-gray-50">

            <div class="p-4 border-t border-gray-200">

    <!-- Interactive Map Modal Overlay -->
    <div id="mapModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-3 md:p-6 hidden opacity-0 transition-opacity duration-300">

                    <button onclick="closeMapModal()" class="w-8 h-8 rounded-full bg-gray-200 hover:bg-gray-300 text-gray-700 flex items-center justify-center transition-colors ml-1">

    <script>
        // Leaflet Map Instance for Modal
        let fullMapInstance = null;
        let hubMarkers = [];
        let activeRoutePath = null;
        let lastOptimizedQuery = "";

        const cityCoords = {
            "Colombo": [6.9344, 79.8500],
            "Kandy": [7.2906, 80.6337],
            "Galle": [6.0535, 80.2210],
            "Matara": [5.9549, 80.5550],
            "Mahiyanganaya": [7.3167, 81.0000],
            "Ella": [6.8667, 81.0466],
            "Badulla": [6.9895, 81.0557],
            "Jaffna": [9.6615, 80.0255],
            "Anuradhapura": [8.3114, 80.4037],
            "Kurunegala": [7.4863, 80.3623],
            "Negombo": [7.2008, 79.8736],
            "Trincomalee": [8.5874, 81.2152]
        };

        function toggleRoutePlanner() {
            const panel = document.getElementById('routePlannerPanel');
            panel.classList.toggle('hidden');
        }

        async function findOptimizedRoute() {
            const origin = document.getElementById('routeOrigin').value;
            const dest = document.getElementById('routeDestination').value;
            const mode = document.getElementById('routeMode').value;
            const btn = document.getElementById('btnSubmitRoute');
            const resultBox = document.getElementById('routeResultBox');
            const resultContent = document.getElementById('routeResultContent');

            if (origin === dest) {
                alert("Please select different starting point and destination.");
                return;
            }

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Analyzing Optimal Route...</span>';
            btn.disabled = true;

            const queryText = `What is the best optimized route from ${origin} to ${dest} by ${mode}? Provide recommended departure times, travel duration, and route details.`;
            lastOptimizedQuery = queryText;

            try {
                // Call live backend API /ask
                const API_URL = window.SYNEXIS_API_URL || (window.location.protocol === "file:" ? "http://localhost:8000/ask" : "/ask");
                const res = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ query: queryText })
                });

                const data = await res.json();
                const answer = data.final_answer || "No route details found.";

                // Render result
                resultBox.classList.remove('hidden');
                resultContent.innerHTML = marked.parse(answer);

                // Fetch Real Curved Route Geometry via OSRM
                const start = cityCoords[origin];
                const end = cityCoords[dest];

                if (start && end && fullMapInstance) {
                    if (activeRoutePath) {
                        fullMapInstance.removeLayer(activeRoutePath);
                    }

                    try {
                        const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${start[1]},${start[0]};${end[1]},${end[0]}?overview=full&geometries=geojson`;
                        const osrmRes = await fetch(osrmUrl);
                        const osrmData = await osrmRes.json();

                        if (osrmData.routes && osrmData.routes.length > 0) {
                            const geojsonCoords = osrmData.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                            activeRoutePath = L.polyline(geojsonCoords, {
                                color: mode === 'train' ? '#2563eb' : '#16a34a',
                                weight: 5,
                                opacity: 0.95
                            }).addTo(fullMapInstance);
                            fullMapInstance.fitBounds(activeRoutePath.getBounds(), { padding: [60, 60] });
                        } else {
                            throw new Error("No OSRM geometry");
                        }
                    } catch (routeErr) {
                        activeRoutePath = L.polyline([start, end], {
                            color: '#2563eb',
                            weight: 5,
                            dashArray: '6, 6',
                            opacity: 0.9
                        }).addTo(fullMapInstance);
                        fullMapInstance.fitBounds(activeRoutePath.getBounds(), { padding: [60, 60] });
                    }
                }
            } catch (err) {
                resultBox.classList.remove('hidden');
                resultContent.innerHTML = `<p class="text-red-500">Error connecting to optimizer API: ${err.message}</p>`;
            } finally {
                btn.innerHTML = '<i class="fas fa-magic"></i><span>Find Optimized Route</span>';
                btn.disabled = false;
            }
        }

        function askRouteInChat() {
            if (lastOptimizedQuery) {
                closeMapModal();
                const input = document.getElementById("userInput");
                input.value = lastOptimizedQuery;
                sendMessage();
            }
        }

        function openMapModal() {
            const modal = document.getElementById('mapModal');
            const container = document.getElementById('mapModalContainer');
            modal.classList.remove('hidden');
            
            // Animation
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                container.classList.remove('scale-95');
                container.classList.add('scale-100');
            }, 10);

            // Initialize Map on first open
            if (!fullMapInstance) {
                initFullTransitMap();
            } else {
                setTimeout(() => {
                    fullMapInstance.invalidateSize();
                }, 200);
            }

            // Close mobile sidebar if open
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        }

        function closeMapModal() {
            const modal = document.getElementById('mapModal');
            const container = document.getElementById('mapModalContainer');
            
            modal.classList.add('opacity-0');
            container.classList.remove('scale-100');
            container.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 250);
        }

        // Close modal on Escape key press
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeMapModal();
        });

        function searchStations(query) {
            if (!query || !fullMapInstance) return;
            const q = query.toLowerCase().trim();
            const found = hubMarkers.find(h => h.hubData.name.toLowerCase().includes(q));
            if (found) {
                fullMapInstance.flyTo(found.hubData.coords, 12, { animate: true, duration: 1.2 });
                found.marker.openPopup();
            }
        }

        function askStationQuery(stationName) {
            closeMapModal();
            const input = document.getElementById("userInput");
            input.value = `What are the latest train and bus schedules for ${stationName}?`;
            sendMessage();
        }

        function initFullTransitMap() {
            // Center on Sri Lanka
            fullMapInstance = L.map('fullMap', {
                zoomControl: true
            }).setView([7.8731, 80.7718], 8);

            // Add tile layer
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 18,
                attribution: '© OpenStreetMap contributors'
            }).addTo(fullMapInstance);

            // Key Hub Stations with Rich Data
            const hubs = [
                {
                    name: "Colombo Fort Central Hub",
                    badge: "Western Province • Main Terminus",
                    coords: [6.9344, 79.8500],
                    lines: "Coastal, Main, Northern & Kelani Valley Lines",
                    trains: "Podi Menike (05:55 AM), Ruhunu Kumari (06:05 AM), Yal Devi (06:35 AM)",
                    buses: "Pettah Bastian Mawatha Central Bus Stand (All island)"
                },
                {
                    name: "Kandy Hub (Goods Shed)",
                    badge: "Central Province • Hill Country Hub",
                    coords: [7.2906, 80.6337],
                    lines: "Main Line Railway & Central Expressway Corridors",
                    trains: "Senkadagala Menike, Udarata Menike, Intercity AC Express",
                    buses: "Goods Shed Bus Stand & EX-02 Colombo Highway Buses"
                },
                {
                    name: "Galle Station & Highway Stand",
                    badge: "Southern Province • Coastal Hub",
                    coords: [6.0535, 80.2210],
                    lines: "Coastal Railway & Southern Expressway EX-01",
                    trains: "Ruhunu Kumari Express, Galle Express, Sagarika",
                    buses: "Galle Highway Stand to Makumbura / Kottawa"
                },
                {
                    name: "Ella Scenic Mountain Terminal",
                    badge: "Uva Province • High Altitude Station",
                    coords: [6.8667, 81.0466],
                    lines: "Main Line Rail (Demodara Nine Arch Bridge)",
                    trains: "Ella Odyssey Tourist Train, Night Mail Express",
                    buses: "Ella Town Junction & Wellawaya Highway Connections"
                },
                {
                    name: "Jaffna Northern Hub",
                    badge: "Northern Province • Northern Terminus",
                    coords: [9.6615, 80.0255],
                    lines: "Northern Express Railway Line",
                    trains: "Yal Devi Express, Uttara Devi, AC Intercity Express",
                    buses: "Jaffna Central Bus Stand (Direct Colombo / Kandy buses)"
                },
                {
                    name: "Makumbura Multimodal Center (Kottawa)",
                    badge: "Western Province • Highway Interchange",
                    coords: [6.8402, 79.9875],
                    lines: "Expressway Highway Bus Network (EX-01, EX-02)",
                    trains: "Kelani Valley Line (Makumbura Station)",
                    buses: "Direct luxury AC buses to Galle, Matara, Hambantota, Kandy"
                }
            ];

            hubMarkers = [];
            hubs.forEach(hub => {
                const marker = L.circleMarker(hub.coords, {
                    radius: 7,
                    fillColor: '#ffffff',
                    color: '#0f172a',
                    weight: 2.5,
                    opacity: 1,
                    fillOpacity: 1
                }).addTo(fullMapInstance);

                const popupHtml = `
                    <div style="min-width: 220px;" class="p-1">
                        <h4 class="font-bold text-gray-900 text-sm mb-0.5">${hub.name}</h4>
                        <span class="inline-block text-[10px] bg-blue-50 text-blue-700 px-1.5 py-0.5 rounded font-medium mb-2 border border-blue-200">${hub.badge}</span>
                        <div class="text-xs text-gray-600 space-y-1 mb-2">
                            <p><b>🚆 Lines:</b> ${hub.lines}</p>
                            <p><b>🕒 Top Trains:</b> ${hub.trains}</p>
                            <p><b>🚌 Buses:</b> ${hub.buses}</p>
                        </div>
                        <button onclick="askStationQuery('${hub.name}')" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs py-1.5 px-3 rounded-md font-medium transition-colors flex items-center justify-center space-x-1.5 shadow-xs">
                            <i class="fas fa-comment-dots"></i>
                            <span>Ask AI for Live Timetables</span>
                        </button>
                    </div>
                `;

                marker.bindPopup(popupHtml);
                hubMarkers.push({ marker: marker, hubData: hub });
            });

            setTimeout(() => {
                fullMapInstance.invalidateSize();
            }, 200);
        }

        function sendQuickQuery(queryText) {
            const input = document.getElementById("userInput");
            input.value = queryText;
            sendMessage();
        }

        // Toggle sidebar on mobile
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.getElementById('overlay');

        menuToggle.addEventListener('click', function () {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        });

        overlay.addEventListener('click', function () {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        });

        // Auto welcome with original clean message
        window.onload = () => {
            appendMessage("Welcome to Sri Lanka Transport Assistant! I can help you with bus, train, and travel information across Sri Lanka. Ask me questions like:\n\n• මට කොළඹ සිට ගාල්ලට යන බස් රථ කීයට තියෙනවාද?\n\n• What time is the next train to Kandy?\n\n• கொழும்பிலிருந்து மாத்தளைக்கு பேருந்து எப்போது?\n\nI understand Sinhala, Tamil, and English!", "bot");
        };

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const text = input.value.trim();
            if (!text) return;

            appendMessage(text, "user");
            input.value = "";
            input.style.height = 'auto';

            // Show typing indicator
            showTypingIndicator();

            try {
                // Dynamic API URL resolution with fallback for local dev, static serving, or remote hosting
                const API_URL = window.SYNEXIS_API_URL ||
                    (window.location.protocol === "file:" ? "http://localhost:8000/ask" : "/ask");

                const res = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ query: text })
                });

                const data = await res.json();

                // Remove typing indicator
                removeTypingIndicator();

                appendMessage(data.final_answer || "Sorry, I couldn't find an answer. Please try rephrasing your question or ask about a different route.", "bot");
            } catch (err) {
                removeTypingIndicator();
                appendMessage("Server error: " + err.message + "\n\nPlease try again later or check your internet connection.", "bot");
            }
        }

        function showTypingIndicator() {
            const box = document.getElementById("chatbox");
            const typingDiv = document.createElement("div");
            typingDiv.id = "typing-indicator";
            typingDiv.className = "flex items-start space-x-3 p-4 bg-gray-50 rounded-xl max-w-3xl";
            typingDiv.innerHTML = `
                <div class="w-9 h-9 bg-blue-600 text-white rounded-full flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-robot text-sm"></i>
                </div>
                <div class="flex-1">
                    <p class="font-medium text-gray-800 mb-2 text-sm">Assistant</p>
                    <div class="flex space-x-1">
                        <span class="typing-indicator"></span>
                        <span class="typing-indicator"></span>
                        <span class="typing-indicator"></span>
                    </div>
                </div>
            `;
            box.appendChild(typingDiv);
            box.scrollTop = box.scrollHeight;
        }

        function removeTypingIndicator() {
            const typingIndicator = document.getElementById("typing-indicator");
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }

        function appendMessage(text, sender) {
            const box = document.getElementById("chatbox");
            const div = document.createElement("div");

            if (sender === 'user') {
                div.className = "flex justify-end";
                div.innerHTML = `
                    <div class="max-w-3xl bg-blue-50 rounded-xl p-4 shadow-sm">
                        <div class="flex items-start space-x-3">
                            <div class="flex-1 text-right">
                                <p class="font-medium text-gray-800 mb-2 text-sm">You</p>
                                <p class="whitespace-pre-line text-sm">${text}</p>
                            </div>
                            <div class="w-9 h-9 bg-green-500 text-white rounded-full flex items-center justify-center flex-shrink-0">
                                <i class="fas fa-user text-sm"></i>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                div.className = "flex items-start space-x-3 p-4 bg-white rounded-xl max-w-3xl shadow-sm border border-gray-100";
                div.innerHTML = `
                    <div class="w-9 h-9 bg-blue-600 text-white rounded-full flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-robot text-sm"></i>
                    </div>
                    <div class="flex-1 markdown-content">
                        <p class="font-medium text-gray-800 mb-2 text-sm">Assistant</p>
                        <div class="text-sm leading-relaxed">${marked.parse(text)}</div>
                    </div>
                `;
            }

            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        document.getElementById("userInput").addEventListener("keypress", e => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Auto-resize textarea
        document.getElementById("userInput").addEventListener("input", function () {
            this.style.height = "auto";
            this.style.height = (this.scrollHeight) + "px";
        });

        // Handle window resize
        window.addEventListener('resize', function () {
            if (window.innerWidth > 768) {
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
            }
            if (fullMapInstance) {
                fullMapInstance.invalidateSize();
            }
        });
    </script>
</body>

</html>
